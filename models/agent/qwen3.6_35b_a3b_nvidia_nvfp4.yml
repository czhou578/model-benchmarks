# Qwen3.6-35B-A3B (hybrid MoE: 30 Gated DeltaNet and 10 full-attention layers, about 3B active parameters) with
# the NVFP4 weights of NVIDIA, for the sandbox step only (docs/sandbox.md). Download the weights first:
#   hf download nvidia/Qwen3.6-35B-A3B-NVFP4
# Not run yet. The flags come from the Qwen worker of dsv4-specialize, which serves a pruned Qwen3.6-35B-A3B on
# vLLM 0.33.0. The differences from a speed config:
#   - Prefix caching is on. vLLM 0.33 uses blocks of 2,176 tokens for this hybrid model, and a hit needs a full block.
#   - --generation-config auto: the server uses the sampling values of the model.
#   - 8 sequences for 8 agents, a fixed KV pool of 16 GiB, and no speculative decoding.
# Stop DeepSeek before the run (window mode). Ask before you stop a worker.
name: qwen3.6-35b-a3b-nvidia-nvfp4-agent
server:
  mode: managed
  command:
    - vllm
    - serve
    - nvidia/Qwen3.6-35B-A3B-NVFP4
    - --host
    - "127.0.0.1"
    - --port
    - "8000"
    - --tensor-parallel-size
    - "1"
    - --gpu-memory-utilization
    - "0.45"
    - --kv-cache-memory-bytes
    - 16G
    - --max-model-len
    - "131072"
    - --max-num-seqs
    - "8"
    - --max-num-batched-tokens
    - "8192"
    - --kv-cache-dtype
    - fp8_e4m3
    - --attention-backend
    - flashinfer
    - --moe-backend
    - flashinfer_cutlass
    - --enable-chunked-prefill
    - --enable-prefix-caching
    - --async-scheduling
    - --reasoning-parser
    - qwen3
    - --tool-call-parser
    - qwen3_xml
    - --enable-auto-tool-choice
    - --enable-per-request-metrics
    - --generation-config
    - auto
  environment:
    VLLM_USE_FASTOKENS: "0"
  startup_timeout_s: 900
  shutdown_timeout_s: 60
endpoint:
  base_url: "http://127.0.0.1:8000"
  model_name: "nvidia/Qwen3.6-35B-A3B-NVFP4"
  chat: true
ready_timeout_s: 900
sandbox:
  agent_eval_commit: null   # set it to the agent-eval commit with task sets (spark-moe-specialize#109)
  heldout_dir: ~/Projects/agent-eval-heldout
  heldout_commit: v1
  agents: 8
  slots: 8
  container_memory: 2g
  stop_new_after: "04:30"
