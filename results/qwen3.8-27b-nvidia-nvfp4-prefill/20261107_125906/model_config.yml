# Prefill-only rerun of models/qwen3.8_27b_nvidia_nvfp4.yml after PR #45.
name: qwen3.8-27b-nvidia-nvfp4-prefill
server:
  mode: managed
  command:
  - vllm
  - serve
  - nvidia/Qwen3.8-27B-NVFP4
  - --host
  - 127.0.0.1
  - --port
  - '8000'
  - --tensor-parallel-size
  - '1'
  - --gpu-memory-utilization
  - '0.45'
  - --kv-cache-memory-bytes
  - 16G
  - --max-model-len
  - '262144'
  - --max-num-seqs
  - '16'
  - --max-num-batched-tokens
  - '8192'
  - --kv-cache-dtype
  - fp8_e4m3
  - --attention-backend
  - flashinfer
  - --enable-chunked-prefill
  - --async-scheduling
  - --reasoning-parser
  - qwen3
  - --tool-call-parser
  - qwen3_coder
  - --enable-auto-tool-choice
  - --enable-per-request-metrics
  - --generation-config
  - vllm
  - --load-format
  - fastsafetensors
  environment:
    VLLM_USE_FASTOKENS: '0'
  startup_timeout_s: 900
  shutdown_timeout_s: 60
endpoint:
  base_url: http://127.0.0.1:8000
  model_name: nvidia/Qwen3.8-27B-NVFP4
  chat: true
ready_timeout_s: 900
monitor_interval_s: 1.0
prompt_lengths:
- 32
- 128
- 512
- 2048
- 8192
- 16384
latency_repeats: 10
decode_lengths:
- 512
- 1024
- 2048
concurrency_levels:
- 1
- 2
- 4
- 8
- 16
concurrency_requests_per_level: 16
concurrency_max_tokens: 256
concurrency_temperature: 0.0
tool_calling_max_tokens: 4096
tool_calling_task_set: lite
prefill_target_lengths:
- 512
- 2048
- 8192
prefill_repetitions: 5
