[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-benchmarks"
version = "0.1.0"
description = "Benchmark harness for local LLMs served by vLLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["mypy", "pytest", "ruff", "types-PyYAML", "types-requests"]

[tool.setuptools]
py-modules = ["core_runner", "batch_run", "dashboard", "memory_guard", "serve_dashboard", "vllm_server"]

# Find every package and subpackage, so that a new subpackage needs no edit here.
[tool.setuptools.packages.find]
include = ["benchmarks*", "harness*"]

[tool.mypy]
python_version = "3.10"
files = [
    "benchmarks",
    "harness",
    "batch_run.py",
    "core_runner.py",
    "dashboard.py",
    "memory_guard.py",
    "serve_dashboard.py",
    "vllm_server.py",
]

# Some third-party modules ship no type hints.
[[tool.mypy.overrides]]
module = ["tiktoken.*", "transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",
    # Docstrings and comments use typographic signs such as "×" on purpose.
    "RUF002",
    "RUF003",
]

