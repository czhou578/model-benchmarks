[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-benchmarks"
version = "0.1.0"
description = "Benchmark harness for local LLMs served by vLLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = ["core_runner", "batch_run", "dashboard", "memory_guard", "serve_dashboard", "vllm_server"]
packages = ["benchmarks", "harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

# Known findings. Each one needs a code change outside the packaging work.
[tool.ruff.lint.per-file-ignores]
"benchmarks/architecture_flops.py" = ["E741"]  # `l` is the layer count.
